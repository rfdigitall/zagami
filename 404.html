<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagina non trovata — Zagami Service srls</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--nero:#0B0D10;--giallo:#FFC200;--rosso:#D42B21;--grigio:#6E7880}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',sans-serif;background:var(--nero);color:#D8DCE3;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.hz{position:fixed;top:0;left:0;right:0;height:5px;background:repeating-linear-gradient(90deg,var(--giallo) 0 16px,var(--nero) 16px 24px)}
.code{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:8rem;color:var(--giallo);line-height:1;margin-bottom:8px}
h1{font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase;font-size:1.8rem;color:#fff;margin-bottom:16px}
p{color:var(--grigio);margin-bottom:32px;max-width:400px}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn-y{display:inline-flex;align-items:center;gap:8px;background:var(--giallo);color:var(--nero);font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.07em;font-size:1rem;padding:14px 24px;border-radius:6px;text-decoration:none}
.btn-g{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.12);color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.07em;font-size:1rem;padding:14px 24px;border-radius:6px;text-decoration:none}
</style>
</head>
<body>
<div class="hz"></div>
<div class="code">404</div>
<h1>Pagina non trovata</h1>
<p>La pagina che stai cercando non esiste o è stata spostata.</p>
<div class="btns">
  <a class="btn-y" href="/">← Torna alla Home</a>
  <a class="btn-g" href="tel:+393312501018">📞 331 250 1018</a>
</div>
</body>
</html>
